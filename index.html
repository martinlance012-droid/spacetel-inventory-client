<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spacetel Inventory – Client View V12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --page:#eff7f2;--card:#fff;--text:#163d2b;--muted:#637b6d;--line:#d8e8de;
  --green:#087746;--green-dark:#064d36;--green-soft:#e7f5ec;
  --shadow:0 3px 12px rgba(7,76,45,.07),0 1px 2px rgba(7,76,45,.05);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif}
body{background:linear-gradient(180deg,#f4faf6 0%,#edf6f0 100%);color:var(--text)}
header{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  position:relative;overflow:hidden;min-height:96px;padding:14px 28px;
  color:#fff;background:linear-gradient(110deg,#064d36 0%,#087746 48%,#239b58 78%,#55b83b 100%);
  box-shadow:0 5px 18px rgba(4,69,42,.18)
}
header h1{margin:0;text-align:center;white-space:nowrap;font-size:clamp(18px,2vw,28px);font-weight:900;letter-spacing:-.035em;z-index:2}
.hd-left{justify-self:start;display:flex;align-items:center;z-index:2}
.hd-spacetel{height:58px;width:auto;display:block;filter:drop-shadow(0 1px 1px #0002)}
.hd-right{justify-self:end;display:flex;align-items:center;gap:12px;z-index:2}
.hd-cricket{height:32px;width:auto;display:block;filter:drop-shadow(0 1px 1px #0002)}
.hd-mascot-fade{height:92px;width:auto;position:absolute;right:0;bottom:-1px;opacity:.9;pointer-events:none}
.page{max-width:1580px;margin:0 auto;padding:15px 22px 34px}
.updated-bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  min-height:48px;margin:0 0 13px;padding:10px 15px;border-radius:12px;
  background:#e3f3e9;color:#0b573b;font-size:13px;font-weight:800;
}
.updated-text{display:flex;align-items:center;gap:9px}
.updated-dot{width:9px;height:9px;flex:none;border-radius:50%;background:#159354;box-shadow:0 0 0 4px #15935420}
button{font:inherit;cursor:pointer}
.theme-toggle{
  padding:6px 13px;border-radius:99px;border:1px solid #0f8060;
  background:#fff;color:#087746;font-size:12px;font-weight:800;
  transition:transform .15s ease,background .15s ease;
}
.theme-toggle:hover{transform:translateY(-1px);background:#f3fbf6}
.region-section{margin:10px 0 12px}
.region-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
  padding:4px 2px 10px;scrollbar-width:thin;scrollbar-color:#9bc9aa transparent;
  -webkit-overflow-scrolling:touch;
}
.region-label{
  position:sticky;left:0;z-index:3;flex:none;padding:8px 9px 8px 2px;
  color:#456c58;background:var(--page);font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;
}
.region-chip{
  flex:0 0 auto;min-height:39px;padding:8px 16px;border-radius:999px;
  border:1px solid #d1e3d8;background:linear-gradient(180deg,#fff,#f6fbf8);
  color:#204a35;font-size:12px;font-weight:800;white-space:nowrap;
  box-shadow:0 2px 6px rgba(10,75,43,.06);
  transition:transform .16s ease,background .16s ease,color .16s ease,border-color .16s ease,box-shadow .16s ease;
}
.region-chip:hover{transform:translateY(-1px);border-color:#7dbc94;background:#e9f7ee}
.region-chip[aria-pressed="true"]{
  background:linear-gradient(135deg,#087746,#159354);border-color:#087746;color:#fff;
  box-shadow:0 4px 12px rgba(8,119,70,.22);
}
.region-bar::-webkit-scrollbar{height:5px}
.region-bar::-webkit-scrollbar-thumb{background:#a9cfb5;border-radius:8px}
.region-prompt{
  display:flex;align-items:center;gap:14px;margin:12px 0 16px;padding:18px 20px;
  border:1px solid #d3e8da;border-radius:14px;background:linear-gradient(110deg,#fbfefc,#e9f6ed);
  color:#174b34;box-shadow:var(--shadow)
}
.prompt-icon{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:13px;background:#d9f1e2;color:#087746;font-size:24px;font-weight:900}
.region-prompt strong{display:block;font-size:14px;font-weight:850}
.region-prompt span{display:block;margin-top:4px;color:#5c7967;font-size:12px}
.hidden{display:none!important}

/* Filters: only the current inventory filters, no metrics or analytics */
.controls{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px 14px;
  margin:12px 0;padding:16px;border:1px solid #d7e8de;border-radius:15px;
  background:linear-gradient(145deg,#fff,#fbfefc);box-shadow:var(--shadow);
}
.filter{position:relative;min-width:0}
.filter-label{display:block;margin:0 0 6px;color:#244b37;font-size:11.5px;font-weight:850}
.search-input,.filter-button,.search-global{
  width:100%;min-height:42px;padding:9px 11px;border:1px solid #c7ddcf;border-radius:10px;
  background:#fbfefc;color:#1b4330;font:600 12px Inter,"Segoe UI",sans-serif;
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
}
.search-input::placeholder,.search-global::placeholder{color:#83998c;font-weight:500}
.search-input:focus,.filter-button:focus,.search-global:focus{
  outline:0;border-color:#26945a;box-shadow:0 0 0 3px rgba(38,148,90,.13);background:#fff;
}
.filter-button{text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#fff}
.filter-button:hover{background:#f4fbf6}
.filter-menu{
  display:none;position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:70;
  max-height:300px;overflow:auto;padding:7px;border:1px solid #cfe2d5;border-radius:11px;
  background:#fff;box-shadow:0 12px 26px rgba(0,0,0,.16)
}
.filter-menu.open{display:block}
.menu-actions{display:flex;gap:6px;padding:2px 2px 7px;margin-bottom:4px;border-bottom:1px solid #e4eee8}
.menu-actions button{
  flex:1;padding:7px 8px;border:1px solid #d1e2d8;border-radius:7px;
  background:#f2f8f4;color:#175e42;font-size:11px;font-weight:800
}
.menu-option{display:flex;align-items:flex-start;gap:8px;padding:8px;border-radius:7px;color:#254b37;font-size:12px;line-height:1.3;cursor:pointer}
.menu-option:hover{background:#eef7f1}
.menu-option input{margin:2px 0 0;accent-color:#087746}
.menu-option span{overflow-wrap:anywhere}
.menu-empty{padding:13px 8px;text-align:center;color:#75887c;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;max-height:52px;overflow:auto;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:4px 8px;border-radius:99px;background:#e3f3e9;border:1px solid #c9e6d3;color:#176344;font-size:10px;font-weight:800}
.chip span{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{padding:0;border:0;background:transparent;color:inherit;font-size:14px;line-height:1}
.status-menu .menu-option{align-items:center}
.search-filter{grid-column:span 1}
.inventory-section{
  margin-top:12px;border:1px solid #d8e8de;border-radius:15px;background:#fff;
  box-shadow:var(--shadow);overflow:hidden
}
.inventory-heading{
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;
  border-bottom:1px solid #e4eee8
}
.inventory-heading h2{margin:0;color:#164c34;font-size:17px;font-weight:900}
.inventory-heading span{color:#789082;font-size:11px;font-weight:650}
.tablewrap{width:100%;overflow:auto}
table{width:100%;min-width:820px;border-collapse:separate;border-spacing:0;table-layout:auto}
thead th{
  position:sticky;top:0;z-index:2;padding:11px 12px;text-align:left;
  background:linear-gradient(90deg,#075b3b,#0b8050);color:#fff;
  font-size:11px;font-weight:850;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap
}
thead th:first-child{border-radius:7px 0 0 0}
thead th:last-child{border-radius:0 7px 0 0}
tbody td{padding:10px 12px;border-bottom:1px solid #e7f0ea;color:#244b37;font-size:12px;line-height:1.3}
tbody tr:nth-child(even){background:#f0f8f3}
tbody tr:nth-child(odd){background:#fff}
tbody tr:hover{background:#e1f3e7}
td.num,th.num{text-align:center}
.qty{display:inline-block;min-width:42px;padding:4px 10px;border-radius:99px;background:#d7f2df;color:#075c37;font-weight:850;text-align:center}
td.total{font-weight:900;text-align:center;color:#0b573b}
.empty-row td{padding:28px 14px;text-align:center;color:#71877a;font-size:13px}
.client-error{
  margin:12px 0;padding:13px 15px;border:1px solid #efdba8;border-radius:11px;
  background:#fff7df;color:#795b15;font-size:13px;font-weight:750
}

/* V10 dark palette: dark teal surfaces, muted table rows, teal-active region buttons */
body[data-theme="midnight"]{
  --page:#09171f;--card:#102632;--text:#e9f2f4;--muted:#93aab2;--line:#1f3d4a;
  background:radial-gradient(1100px 380px at 8% -10%,#12363a 0,transparent 60%),#09171f;
  color:#e9f2f4;
}
body[data-theme="midnight"] .updated-bar{background:#12303d;color:#e9f2f4}
body[data-theme="midnight"] .theme-toggle{background:transparent;color:#f2b134;border-color:#f2b134}
body[data-theme="midnight"] .region-label{background:#09171f;color:#a9c7c3}
body[data-theme="midnight"] .region-chip{background:linear-gradient(180deg,#172a30,#142329);border-color:#29434a;color:#e6efec}
body[data-theme="midnight"] .region-chip:hover{background:#1f5368;border-color:#477b8d;color:#fff}
body[data-theme="midnight"] .region-chip[aria-pressed="true"]{background:linear-gradient(135deg,#0f766e,#168b80);border-color:#24978d;color:#fff}
body[data-theme="midnight"] .region-prompt{background:linear-gradient(110deg,#142d37,#173a43);border-color:#315361;color:#e9f2f4}
body[data-theme="midnight"] .prompt-icon{background:#214956;color:#9be3cf}
body[data-theme="midnight"] .region-prompt span{color:#a9c1c8}
body[data-theme="midnight"] .controls,body[data-theme="midnight"] .inventory-section{background:#102632;border-color:#1f3d4a}
body[data-theme="midnight"] .filter-label{color:#c5d5d0}
body[data-theme="midnight"] .search-input,body[data-theme="midnight"] .filter-button,body[data-theme="midnight"] .search-global{
  background:#102632;color:#e9f2f4;border-color:#294b57
}
body[data-theme="midnight"] .search-input::placeholder,body[data-theme="midnight"] .search-global::placeholder{color:#91a8b0}
body[data-theme="midnight"] .filter-button:hover{background:#16313f}
body[data-theme="midnight"] .filter-menu{background:#102632;color:#e9f2f4;border-color:#2c5266}
body[data-theme="midnight"] .menu-actions{border-color:#29434a}
body[data-theme="midnight"] .menu-actions button{background:#16313f;color:#cfe3e8;border-color:#2d5360}
body[data-theme="midnight"] .menu-option{color:#e3eef1}
body[data-theme="midnight"] .menu-option:hover{background:#1f5368;color:#fff}
body[data-theme="midnight"] .chip{background:#1f3a36;color:#9be3cf;border-color:#315a57}
body[data-theme="midnight"] .inventory-heading{border-color:#29434a}
body[data-theme="midnight"] .inventory-heading h2{color:#e6f2f4}
body[data-theme="midnight"] .inventory-heading span{color:#9bb0b7}
body[data-theme="midnight"] .inventory-section{background:#102632}
body[data-theme="midnight"] tbody td{color:#e4eef1;border-color:#263f49}
body[data-theme="midnight"] tbody tr:nth-child(even){background:#192a2f}
body[data-theme="midnight"] tbody tr:nth-child(odd){background:#162328}
body[data-theme="midnight"] tbody tr:hover{background:#1f5368}
body[data-theme="midnight"] .qty{background:#1f3a36;color:#9be3cf}
body[data-theme="midnight"] td.total{color:#f2b134}
body[data-theme="midnight"] .client-error{background:#302918;border-color:#66501c;color:#f2ce72}

/* Responsive */
@media(max-width:1050px){
  .controls{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  header{min-height:65px;padding:9px 12px;gap:8px}
  .hd-spacetel{height:34px}.hd-cricket{height:19px}
  header h1{font-size:14px;white-space:normal;line-height:1.1}
  .hd-mascot-fade{height:56px}
  .page{padding:12px}
}
@media(max-width:620px){
  header{grid-template-columns:auto minmax(0,1fr) auto;gap:7px;min-height:58px;padding:8px}
  .hd-spacetel{height:27px}.hd-cricket{height:15px}
  header h1{font-size:11px;letter-spacing:-.02em}
  .hd-mascot-fade{height:42px;opacity:.7}
  .page{padding:10px}
  .updated-bar{padding:9px 11px;font-size:11px}
  .region-label{position:static}
  .region-chip{min-height:36px;padding:7px 12px;font-size:11px}
  .controls{grid-template-columns:1fr;gap:11px;padding:12px}
  .inventory-heading{padding:12px}
  .inventory-heading h2{font-size:15px}
  table{min-width:760px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

<main class="page">
  <div class="updated-bar">
    <div class="updated-text"><span class="updated-dot"></span><span id="updatedText">Loading the latest inventory details...</span></div>
    <button id="themeToggle" class="theme-toggle" type="button">☀ Light</button>
  </div>

  <div id="loadMessage"></div>
  <section class="region-section">
    <div id="regionBar" class="region-bar" role="group" aria-label="Choose inventory region">
      <span class="region-label">Region</span>
    </div>
    <div id="regionPrompt" class="region-prompt hidden">
      <div class="prompt-icon">⌖</div>
      <div>
        <strong>Select a region to view inventory</strong>
        <span>Choose a region above. Your inventory filters and stock details will appear here.</span>
      </div>
    </div>
  </section>

  <section id="clientControls" class="controls hidden" aria-label="Inventory filters">
    <div class="filter" id="filterAm"></div>
    <div class="filter" id="filterLoc"></div>
    <div class="filter" id="filterProduct"></div>
    <div class="filter" id="filterStatus"></div>
    <div class="filter search-filter">
      <label class="filter-label" for="globalSearch">Search Product / Location</label>
      <input id="globalSearch" class="search-global" type="search" placeholder="Start typing a device or location name..." autocomplete="off">
    </div>
  </section>

  <section id="inventorySection" class="inventory-section hidden">
    <div class="inventory-heading">
      <h2>Inventory Details</h2>
      <span id="tableCaption">In-stock inventory</span>
    </div>
    <div class="tablewrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
'use strict';
const $=id=>document.getElementById(id);
const norm=s=>String(s??'').trim().toLowerCase();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const unique=a=>[...new Set(a)].filter(v=>v!==''&&v!=null).sort((a,b)=>String(a).localeCompare(String(b)));
const statusLabel=s=>{
  const m={AVAILABLE:'Available','ON ORDER':'On Order',ON_ORDER:'On Order',RETURN:'Return',RETURNED:'Returned'};
  return m[s]||String(s).toLowerCase().replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
};
let inventory=[];
let activeRegion=null;             // null means All Regions
let regionChosen=false;           // hide filters until the first region choice
let selectedAM=[];
let selectedLocations=[];
let selectedProducts=[];
let selectedStatuses=['AVAILABLE'];
const multiDefs={
  am:{host:'filterAm',label:'Area Manager',plural:'area managers',all:'All Area Managers',get:()=>selectedAM,set:v=>selectedAM=v,options:()=>unique(baseRows().map(r=>r['Area Manager']))},
  loc:{host:'filterLoc',label:'Location',plural:'locations',all:'All Locations',get:()=>selectedLocations,set:v=>selectedLocations=v,options:()=>unique(baseRows().filter(r=>!selectedAM.length||selectedAM.includes(r['Area Manager'])).map(r=>r.Location))},
  product:{host:'filterProduct',label:'Product Name',plural:'products',all:'All Products',get:()=>selectedProducts,set:v=>selectedProducts=v,options:()=>unique(baseRows().filter(r=>(!selectedAM.length||selectedAM.includes(r['Area Manager']))&&(!selectedLocations.length||selectedLocations.includes(r.Location))).map(r=>r.Product))},
  status:{host:'filterStatus',label:'Status',plural:'statuses',all:'Available',get:()=>selectedStatuses,set:v=>selectedStatuses=v,options:()=>statusOptions()}
};
function statusOptions(){return unique(inventory.flatMap(r=>Object.keys(r.StatusCounts||{}))).sort((a,b)=>{
  const o=['AVAILABLE','ON ORDER','ON_ORDER','RETURN','RETURNED','TRANSFER_IN','TRANSFER_OUT','NON_SELLABLE','NON_RETURNABLE'];
  const ia=o.indexOf(a),ib=o.indexOf(b); if(ia>=0||ib>=0) return (ia<0?99:ia)-(ib<0?99:ib); return a.localeCompare(b);
});}
function baseRows(){
  return inventory.filter(r=>activeRegion===null||activeRegion===''||norm(r.Region)===norm(activeRegion));
}
function selectedQty(r){return selectedStatuses.reduce((sum,s)=>sum+Number((r.StatusCounts||{})[s]||0),0);}
function makeMultiSelect(key){
  const d=multiDefs[key],host=$(d.host);
  host.innerHTML=`
    <label class="filter-label">${esc(d.label)} <span style="font-weight:600;color:#82978a">(multiple)</span></label>
    <input class="search-input" type="search" placeholder="Type to find ${key==='product'?'products':' '+(key==='am'?'area managers':key==='loc'?'locations':'statuses')}..." autocomplete="off">
    <button class="filter-button" type="button">${esc(d.all)} ▾</button>
    <div class="chips"></div><div class="filter-menu"></div>`;
  const input=host.querySelector('.search-input'),button=host.querySelector('.filter-button'),menu=host.querySelector('.filter-menu');
  function updateLabel(){
    const sel=d.get(),label=key==='status'?(sel.length?sel.map(statusLabel).join(', '):'Select Status'):(sel.length?(sel.length===1?sel[0]:sel.length+' '+d.plural+' selected'):d.all);
    button.textContent=label+' ▾';
    host.querySelector('.chips').innerHTML=sel.map(v=>`<span class="chip"><span title="${esc(key==='status'?statusLabel(v):v)}">${esc(key==='status'?statusLabel(v):v)}</span><button type="button" data-value="${esc(v)}" aria-label="Remove ${esc(v)}">×</button></span>`).join('');
    host.querySelectorAll('.chips button').forEach(b=>b.addEventListener('click',()=>{d.set(d.get().filter(x=>x!==b.dataset.value));refreshAll(key);}));
  }
  function renderMenu(open){
    const q=input.value.trim().toLowerCase(),all=d.options(),match=all.filter(v=>(key==='status'?statusLabel(v):v).toLowerCase().includes(q)),vis=match.slice(0,500);
    menu.innerHTML=`<div class="menu-actions"><button type="button" data-action="all">Select All${q?' Matching':''}</button><button type="button" data-action="clear">Clear</button></div>`+
      (vis.length?vis.map(v=>`<label class="menu-option"><input type="checkbox" value="${esc(v)}" ${d.get().includes(v)?'checked':''}><span>${esc(key==='status'?statusLabel(v):v)}</span></label>`).join(''):`<div class="menu-empty">No matching ${d.plural}.</div>`);
    menu.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',()=>{const cur=d.get();d.set(cb.checked?[...new Set([...cur,cb.value])]:cur.filter(x=>x!==cb.value));refreshAll(key);}));
    menu.querySelector('[data-action="all"]').onclick=()=>{d.set([...new Set([...d.get(),...vis])]);refreshAll(key);};
    menu.querySelector('[data-action="clear"]').onclick=()=>{d.set([]);refreshAll(key);};
    if(open){closeAllMenus(menu);menu.classList.add('open');}
  }
  input.addEventListener('focus',()=>renderMenu(true));
  input.addEventListener('input',()=>renderMenu(true));
  button.addEventListener('click',()=>{const was=menu.classList.contains('open');closeAllMenus();if(!was)renderMenu(true);});
  updateLabel();
  return {updateLabel,renderMenu,menu,input,key};
}
const multiUI={};
function closeAllMenus(keep=null){document.querySelectorAll('.filter-menu.open').forEach(m=>{if(m!==keep)m.classList.remove('open');});}
document.addEventListener('click',e=>{if(!e.target.closest('.filter'))closeAllMenus();});
function statusOptionsUpdate(){
  if(!multiUI.status)return;
  multiUI.status.updateLabel();multiUI.status.renderMenu(false);
}
function refreshAll(changed){
  // Keep selections valid when a parent filter changes.
  const ams=multiDefs.am.options(); selectedAM=selectedAM.filter(v=>ams.includes(v));
  const locs=multiDefs.loc.options(); selectedLocations=selectedLocations.filter(v=>locs.includes(v));
  const prods=multiDefs.product.options(); selectedProducts=selectedProducts.filter(v=>prods.includes(v));
  Object.values(multiUI).forEach(ui=>{ui.updateLabel();if(ui.menu.classList.contains('open'))ui.renderMenu(true);});
  renderTable();
}
function renderTable(){
  const q=norm($('globalSearch').value);
  let rows=baseRows().filter(r=>
    (!selectedAM.length||selectedAM.includes(r['Area Manager']))&&
    (!selectedLocations.length||selectedLocations.includes(r.Location))&&
    (!selectedProducts.length||selectedProducts.includes(r.Product))&&
    selectedQty(r)>0&&
    (!q||(String(r.Location)+' '+String(r.Product)+' '+String(r['Area Manager'])+' '+String(r.Region||'')).toLowerCase().includes(q))
  );
  rows.sort((a,b)=>{
    const an=parseInt(String(a.Location).match(/^\s*(\d+)/)?.[1]||'999999',10);
    const bn=parseInt(String(b.Location).match(/^\s*(\d+)/)?.[1]||'999999',10);
    return an-bn||String(a.Location).localeCompare(String(b.Location))||String(a.Product).localeCompare(String(b.Product));
  });
  const statuses=selectedStatuses.slice();
  $('tableCaption').textContent=statuses.length?statuses.map(statusLabel).join(' + ')+' inventory':'No status selected';
  const headers=`<tr><th>Area Manager</th><th>Region</th><th>Location</th><th>Product Name</th>${statuses.map(s=>`<th class="num">${esc(statusLabel(s))}</th>`).join('')}<th class="num">Total</th></tr>`;
  $('tableHead').innerHTML=headers;
  const colspan=5+statuses.length;
  $('tableBody').innerHTML=rows.length?rows.map(r=>{
    const counts=statuses.map(s=>`<td class="num"><span class="qty">${Number((r.StatusCounts||{})[s]||0).toLocaleString()}</span></td>`).join('');
    return `<tr><td>${esc(r['Area Manager']||'')}</td><td>${esc(r.Region||'')}</td><td>${esc(r.Location||'')}</td><td>${esc(r.Product||'')}</td>${counts}<td class="total">${selectedQty(r).toLocaleString()}</td></tr>`;
  }).join(''):`<tr class="empty-row"><td colspan="${colspan}">No inventory matches the selected filters.</td></tr>`;
}
function renderRegionBar(){
  const bar=$('regionBar');
  const regions=unique(inventory.map(r=>r.Region).filter(Boolean));
  const counts=new Map(regions.map(region=>[region,inventory.filter(r=>norm(r.Region)===norm(region)).length]));
  regions.sort((a,b)=>counts.get(b)-counts.get(a)||a.localeCompare(b));
  const make=(v,label)=>`<button class="region-chip" type="button" data-region="${esc(v??'')}" aria-pressed="${regionChosen&&((activeRegion===null&&String(v??'')==='')||(activeRegion!==null&&norm(activeRegion)===norm(v??'')))?'true':'false'}">${esc(label)}</button>`;
  bar.innerHTML=`<span class="region-label">Region</span>${make('', 'All Regions')}`+
    regions.map(r=>make(r,r==='UNMAPPED'?'Unmapped':r)).join('');
  bar.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{
    activeRegion=btn.dataset.region===''?null:btn.dataset.region;
    regionChosen=true;
    selectedAM=[];selectedLocations=[];selectedProducts=[];
    Object.values(multiUI).forEach(ui=>{ui.input.value='';ui.menu.classList.remove('open');ui.updateLabel();});
    document.body.classList.add('region-selected');
    renderRegionBar();
    $('clientControls').classList.remove('hidden');
    $('inventorySection').classList.remove('hidden');
    $('regionPrompt').classList.add('hidden');
    refreshAll('region');
  }));
}
function sourceTimestamp(payload){
  if(payload.sourceUpdated) return 'Source report last updated on '+payload.sourceUpdated;
  if(payload.publishedAt) return 'Inventory data published on '+new Date(payload.publishedAt).toLocaleString();
  return 'Inventory data updated';
}
function setTheme(theme){
  document.body.dataset.theme=theme;
  $('themeToggle').textContent=theme==='midnight'?'☀ Light':'🌙 Dark';
  try{localStorage.setItem('spacetel-client-theme',theme);}catch(e){}
}
$('themeToggle').addEventListener('click',()=>setTheme(document.body.dataset.theme==='midnight'?'fresh':'midnight'));
try{setTheme(localStorage.getItem('spacetel-client-theme')||'midnight');}catch(e){setTheme('midnight');}
$('globalSearch').addEventListener('input',renderTable);

async function gunzipFromBase64(base64){
  if(!('DecompressionStream' in window)) throw new Error('This browser does not support the compressed inventory format. Please use an updated Chrome or Edge browser.');
  const raw=atob(base64),bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}
async function loadPublishedData(){
  try{
    const response=await fetch('./spacetel-public-data.json?nocache='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('Client inventory data has not been published yet.');
    const payload=await response.json();
    if(payload.format!=='spacetel-inventory-client-v1'||!payload.packedRows)throw new Error('The published inventory file has an invalid format.');
    const unpacked=JSON.parse(await gunzipFromBase64(payload.packedRows)),d=unpacked.d;
    inventory=unpacked.r.map(x=>({
      'Area Manager':d.am[x[0]],
      Region:d.rg[x[1]],
      Location:d.lc[x[2]],
      Product:d.pr[x[3]],
      StatusCounts:Object.fromEntries(x[4].map(([s,n])=>[d.st[s],n]))
    }));
    $('updatedText').textContent=sourceTimestamp(payload);
    renderRegionBar();
    $('regionPrompt').classList.remove('hidden');
    $('loadMessage').textContent='';
    $('loadMessage').className='';
    // Initialize filter widgets only after inventory has loaded.
    Object.keys(multiDefs).forEach(k=>{multiUI[k]=makeMultiSelect(k);});
    // Available is the client default; status filter remains available to the user.
    selectedStatuses=['AVAILABLE'];
    multiUI.status.updateLabel();
  }catch(err){
    console.error(err);
    $('updatedText').textContent='Inventory status unavailable';
    $('loadMessage').className='client-error';
    $('loadMessage').textContent='The latest inventory has not been published yet. Please contact your Spacetel administrator.';
  }
}
loadPublishedData();
</script>
